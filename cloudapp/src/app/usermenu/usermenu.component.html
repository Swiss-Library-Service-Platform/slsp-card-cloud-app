<ng-container *ngIf="vm$ | async as vm; else loading">
  <div *ngIf="vm.sandbox" class="info-test-env">
    Test instance using Alma Sandbox environment
  </div>

  <div class="user-header" fxLayout="row">
    <button mat-flat-button color="secondary" (click)="navigateBack()">
      <mat-icon inline="true">arrow_back_ios</mat-icon>
      {{ 'General.BackToMenu' | translate }}
    </button>
    <span>
      <mat-icon size="20">account_circle</mat-icon>
      <div class="user-header-text">{{ vm.patron.fullName }}</div>
    </span>
  </div>

  <mat-tab-group mat-stretch-tabs>
    <mat-tab [label]="'Main.LibraryCardNumber' | translate">
      <app-librarycardnumber></app-librarycardnumber>
    </mat-tab>
    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon *ngIf="vm.hasBlocks" class="blocks-tab-icon">
          warning
        </mat-icon>
        {{ 'Main.Block' | translate }}
      </ng-template>
      <app-block></app-block>
    </mat-tab>
    <mat-tab [label]="'Main.Settings' | translate">
      <app-settings></app-settings>
    </mat-tab>
  </mat-tab-group>

  <div class="please-note">
    <span>{{ 'Main.PleaseNote' | translate }}</span>
    {{ 'Main.TakesAFewMinutes' | translate }}
  </div>
</ng-container>

<ng-template #loading>
  <div class="loading-shade">
    <mat-spinner diameter="50"></mat-spinner>
  </div>
</ng-template>
