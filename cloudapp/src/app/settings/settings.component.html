<ng-container *ngIf="patron$ | async as patron">
  <div class="slsp-screen">
    <app-preferred-address
      [patron]="patron"
      [disabled]="mutationBusy"
      (busyChange)="setMutationBusy($event)"
    ></app-preferred-address>

    <app-invoice-contacts
      [patron]="patron"
      [disabled]="mutationBusy"
      (busyChange)="setMutationBusy($event)"
    ></app-invoice-contacts>

    <app-user-group
      [patron]="patron"
      [disabled]="mutationBusy"
    ></app-user-group>
  </div>
</ng-container>

<div class="loading-shade" *ngIf="mutationBusy">
  <mat-spinner diameter="50"></mat-spinner>
</div>
