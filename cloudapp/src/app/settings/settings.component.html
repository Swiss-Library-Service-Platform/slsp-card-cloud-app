<ng-container *ngIf="patron$ | async as patron">
  <div class="slsp-screen">
    <app-preferred-address
      [patron]="patron"
      [disabled]="mutationBusy"
      (busyChange)="setMutationBusy($event)"
    ></app-preferred-address>

    <app-invoice-contacts
      [patron]="patron"
      [disabled]="mutationBusy"
      (busyChange)="setMutationBusy($event)"
    ></app-invoice-contacts>

    <section
      class="slsp-section slsp-placeholder"
      data-placeholder="user-group"
    >
      <app-expandable-section-header
        [title]="'Settings.UserGroup' | translate"
        [infoLabel]="'Settings.MoreInformation' | translate"
        [status]="'Settings.NotAvailableYet' | translate"
      >
        <p class="slsp-section__information">
          {{ 'Settings.UserGroupDescription' | translate }}
        </p>
      </app-expandable-section-header>
    </section>
  </div>
</ng-container>

<div class="loading-shade" *ngIf="mutationBusy">
  <mat-spinner diameter="50"></mat-spinner>
</div>
