<h1 mat-dialog-title>Confirm</h1>
<div mat-dialog-content>{{ data.confirmMessage }}</div>
<div mat-dialog-actions>
  <button mat-button class="confirm-button" (click)="dialogRef.close(true)">
    {{ 'General.Confirm' | translate }}
  </button>
  <button mat-button class="cancel-button" (click)="dialogRef.close(false)">
    {{ 'General.Cancel' | translate }}
  </button>
</div>
